name: Build EarnTaka APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip EarnTaka_Android_Starter_v3.zip -d source

      - name: Build
        run: |
          cd source/EarnTaka_Android_Starter
          chmod +x gradlew || true
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnTaka-APK
          path: source/EarnTaka_Android_Starter/app/build/outputs/apk/debug/*.apk
